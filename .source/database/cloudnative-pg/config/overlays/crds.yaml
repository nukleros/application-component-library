---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "cloudnative-pg custom resource definitions"
    path: "../../vendor/cnpg-1.30.1.yaml"
    outputPath: "database/cloudnative-pg/crds.yaml"
    overlays:
      - name: "ensure we are only acting upon crds"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "CustomResourceDefinition")]
