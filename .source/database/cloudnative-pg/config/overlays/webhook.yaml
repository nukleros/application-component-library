---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "cloudnative-pg webhooks"
    path: "../../vendor/cnpg-1.30.1.yaml"
    outputPath: "database/cloudnative-pg/webhook.yaml"
    overlays:
      - name: "ensure we are only acting upon webhook resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ValidatingWebhookConfiguration")]
              - query: $[?($.kind != "MutatingWebhookConfiguration")]

      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - webhooks[*].clientConfig.service.namespace
        value: "{{ .namespace }}"
