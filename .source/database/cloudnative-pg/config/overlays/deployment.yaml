---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

  - name: "apply nukleros labels to pod template"
    query: "spec.template.metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "cloudnative-pg deployments"
    path: "../../vendor/cnpg-1.30.1.yaml"
    outputPath: "database/cloudnative-pg/deployment.yaml"
    overlays:
      - name: "ensure we are only acting upon deployment resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "Deployment")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"

      - name: "ensure replicas are updated"
        query: spec.replicas
        value: !!int {{ .replicas }}

      - name: "ensure controller resources are updated"
        query: spec.template.spec.containers[*].resources
        action: replace
        value:
          requests:
            cpu: "{{ .controller.resources.requests.cpu }}"
            memory: "{{ .controller.resources.requests.memory }}"
          limits:
            memory: "{{ .controller.resources.limits.memory }}"
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "cnpg-controller-manager")]

      - name: "ensure controller affinity is set"
        query: spec.template.spec
        action: merge
        value:
          affinity:
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchExpressions:
                        - key: app.kubernetes.io/name
                          operator: In
                          values:
                            - cloudnative-pg
          nodeSelector:
            kubernetes.io/os: linux
        documentQuery:
          - conditions:
              - query: $[?($.metadata.name == "cnpg-controller-manager")]
