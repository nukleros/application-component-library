---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "cloudnative-pg configmaps"
    path: "../../vendor/cnpg-1.30.1.yaml"
    outputPath: "database/cloudnative-pg/config.yaml"
    overlays:
      - name: "ensure we are only acting upon configmap resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ConfigMap")]

      - name: "ensure namespace is updated"
        query: metadata.namespace
        value: "{{ .namespace }}"
