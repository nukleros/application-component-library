---
commonOverlays:
  - name: "apply nukleros labels"
    query: "metadata.labels"
    value:
      application.nukleros.io/category: "{{ .category }}"
      application.nukleros.io/project: "{{ .project }}"
    onMissing:
      action: inject

yamlFiles:
  - name: "cloudnative-pg rbac"
    path: "../../vendor/cnpg-1.30.1.yaml"
    outputPath: "database/cloudnative-pg/rbac.yaml"
    overlays:
      - name: "ensure we are only acting upon rbac resources"
        query: "$"
        action: delete
        documentQuery:
          - conditions:
              - query: $[?($.kind != "ServiceAccount")]
              - query: $[?($.kind != "Role")]
              - query: $[?($.kind != "RoleBinding")]
              - query: $[?($.kind != "ClusterRole")]
              - query: $[?($.kind != "ClusterRoleBinding")]

      - name: "ensure namespace is updated"
        query:
          - metadata.namespace
          - subjects[*].namespace
        value: "{{ .namespace }}"
